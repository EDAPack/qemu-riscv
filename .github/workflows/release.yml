name: Release
on:
  workflow_dispatch:
    inputs:
      qemu_tag:
        description: 'QEMU tag to build (e.g., v9.2.0)'
        required: true
        type: string

jobs:
    # ------------------------------------------------------------------ #
    # gate: the release master switch. ONE file, above both forges, decides
    # who may publish this repo:
    #     https://dvkit.org/.well-known/release-authority.json
    # It is generated from sync-policy.toml by `git-sync emit-release-authority`,
    # so GitHub and Forgejo cannot drift -- there is only one copy for them to
    # disagree about. The runner only READS it, over plain HTTPS with no
    # credential: a workflow file is public and editable by anyone who can
    # push, so a secret here would protect nothing.
    #
    # `if:` on a job cannot reference a step in its own job, which is why the
    # switch is resolved here and consumed through needs.gate.outputs.authority
    # -- and why `publish` must declare `needs: gate`. OMIT THAT AND THE
    # EXPRESSION IS AN EMPTY STRING, not an error: nothing publishes, nothing
    # goes red, and the repo quietly stops releasing.
    # ------------------------------------------------------------------ #
    gate:
        name: Release authority
        runs-on: 'ubuntu-latest'
        outputs:
            authority: ${{ steps.resolve.outputs.authority }}
        steps:
        - id: resolve
          # The python is ONE LINE on purpose: a multi-line `python3 -c` body
          # has to start at column 0, which ends the YAML block scalar above it
          # and silently corrupts the workflow rather than failing to parse.
          run: |
            url=https://dvkit.org/.well-known/release-authority.json
            if ! body=$(curl -fsS --max-time 10 "$url"); then
              # DECIDED 2026-08-30: fail CLOSED when a release could actually
              # happen. A release blocked by a dvkit.org outage is recoverable
              # in ten minutes; a release published twice from two forges is
              # not -- a GitHub Release can be deleted, but the artifacts people
              # already downloaded cannot be recalled.
              #
              # Here "could actually happen" is any event that is not a push,
              # because a push never publishes in this repo (see `publish`).
              case "$GITHUB_EVENT_NAME" in
                push)
                  echo "authority=none" >> "$GITHUB_OUTPUT"
                  echo "switch unreachable on a push; nothing to release"
                  exit 0 ;;
                *)
                  echo "::error::release-authority switch unreachable; refusing to publish"
                  exit 1 ;;
              esac
            fi
            auth=$(printf '%s' "$body" | python3 -c 'import json,os,sys; d=json.load(sys.stdin); r=os.environ["GITHUB_REPOSITORY"]; print(d["repos"].get(r) or d["orgs"].get(r.split("/")[0]) or d["default"])')
            echo "release authority for $GITHUB_REPOSITORY: $auth"
            echo "authority=$auth" >> "$GITHUB_OUTPUT"

    version-check:
        runs-on: 'ubuntu-latest'
        outputs:
            qemu_tag: ${{ steps.check.outputs.qemu_tag }}
            rls_version: ${{ steps.check.outputs.rls_version }}
        steps:
        - name: fetch-version
          id: check
          run: |
            qemu_tag="${{ inputs.qemu_tag }}"
            
            # Validate the tag exists in the QEMU repo
            tag_check=$(curl -s -L \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -o /dev/null -w "%{http_code}" \
                "https://api.github.com/repos/qemu/qemu/git/refs/tags/${qemu_tag}")
            
            if [ "$tag_check" != "200" ]; then
                echo "Error: Tag '${qemu_tag}' not found in qemu/qemu repository"
                exit 1
            fi
            
            # Extract version number from tag (remove leading 'v' if present)
            rls_version=$(echo "${qemu_tag}" | sed -e 's/^v//')

            echo "qemu_tag: ${qemu_tag}"
            echo "rls_version: ${rls_version}"

            echo "qemu_tag=${qemu_tag}" >> ${GITHUB_OUTPUT}
            echo "rls_version=${rls_version}" >> ${GITHUB_OUTPUT}

            cat ${GITHUB_OUTPUT}
        - name: print
          run: |
            echo "qemu_tag: ${{ steps.check.outputs.qemu_tag }}"
            echo "rls_version: ${{ steps.check.outputs.rls_version }}"


    build-linux-x86_64:
        runs-on: 'ubuntu-latest'
        needs: version-check
        strategy:
          matrix:
            # Skip manylinux2014 - glib is too old (2.56, need 2.66+)
            image: [manylinux_2_28_x86_64, manylinux_2_34_x86_64]
        steps:
            - uses: actions/checkout@v4
            - name: print
              run: |
                echo "print"
                echo "image: ${{ matrix.image }}"
                echo "qemu_tag: ${{ needs.version-check.outputs.qemu_tag }}"
                echo "rls_version: ${{ needs.version-check.outputs.rls_version }}"
            - name: build
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                image: ${{ matrix.image }}
                qemu_latest_rls: ${{ needs.version-check.outputs.qemu_tag }}
                rls_version: ${{ needs.version-check.outputs.rls_version }}
              run: >
                docker run --rm
                --volume "$(pwd):/io"
                --env qemu_latest_rls
                --env rls_version
                --env image
                --workdir /io
                quay.io/pypa/${{ matrix.image }}
                /io/scripts/build.sh
            - name: upload artifact
              uses: actions/upload-artifact@v4
              with:
                name: "qemu-riscv-${{ matrix.image }}"
                path: "release/qemu-riscv-${{ matrix.image }}-*.tar.gz"
                if-no-files-found: error
                retention-days: 7

    # Disabled for now - enable after manylinux builds are working
    # build-linux-arm64:
    #     runs-on: 'ubuntu-24.04-arm'
    #     needs: version-check
    #     strategy:
    #       matrix:
    #         image: [manylinux_2_28_aarch64, manylinux_2_34_aarch64]
    #     steps:
    #         - uses: actions/checkout@v4
    #         - name: print
    #           run: |
    #             echo "print"
    #             echo "image: ${{ matrix.image }}"
    #             echo "qemu_tag: ${{ needs.version-check.outputs.qemu_tag }}"
    #             echo "rls_version: ${{ needs.version-check.outputs.rls_version }}"
    #         - name: build
    #           env:
    #             GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    #             image: ${{ matrix.image }}
    #             qemu_latest_rls: ${{ needs.version-check.outputs.qemu_tag }}
    #             rls_version: ${{ needs.version-check.outputs.rls_version }}
    #           run: >
    #             docker run --rm
    #             --volume "$(pwd):/io"
    #             --env qemu_latest_rls
    #             --env rls_version
