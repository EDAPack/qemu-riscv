    #             name: "qemu-riscv-${{ matrix.image }}"
    #             path: "release/qemu-riscv-${{ matrix.image }}-*.tar.gz"
    #             if-no-files-found: error
    #             retention-days: 7

    # Disabled for now - enable after manylinux builds are working
    # build-macos-arm64:
    #     runs-on: 'macos-14'
    #     needs: version-check
    #     steps:
    #         - uses: actions/checkout@v4
    #         - name: Install dependencies
    #           run: |
    #             brew install ninja pixman glib pkg-config
    #         - name: print
    #           run: |
    #             echo "qemu_tag: ${{ needs.version-check.outputs.qemu_tag }}"
    #             echo "rls_version: ${{ needs.version-check.outputs.rls_version }}"
    #         - name: build
    #           env:
    #             GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    #             image: macos-arm64
    #             qemu_latest_rls: ${{ needs.version-check.outputs.qemu_tag }}
    #             rls_version: ${{ needs.version-check.outputs.rls_version }}
    #           run: |
    #             ./scripts/build.sh
    #         - name: upload artifact
    #           uses: actions/upload-artifact@v4
    #           with:
    #             name: "qemu-riscv-macos-arm64"
    #             path: "release/qemu-riscv-macos-arm64-*.tar.gz"
    #             if-no-files-found: error
    #             retention-days: 7

    publish:
        # TWO conditions, each load-bearing for a different reason.
        #
        #   github.event_name != 'push'
        #       SYNC SAFETY. This repo's history now moves between Forgejo and
        #       GitHub on a five-minute cron, and git-sync produces exactly one
        #       kind of event: a push. Until 2026-08-31 this job had NO
        #       condition at all and the workflow triggers on a bare `push:`
        #       with no branch filter -- so a sync cycle was a release trigger,
        #       and a mirror operation must never be a publishing operation.
        #
        #       DELIBERATE DEVIATION from adding-orgs.md §E2.2, which requires a
        #       `v*` tag and nothing else. That rule is written for repos where
        #       a human pushes the tag and the tag IS the version. Here the tag
        #       is COMPUTED from the upstream version and created BY this job --
        #       it is a release's output, not its trigger -- so tag-gating a job
        #       whose purpose is to create the tag is unsatisfiable rather than
        #       stricter. The property §E2.2 protects is the one on the line
        #       above, and excluding the one event a mirror can produce delivers
        #       it exactly. `schedule` and `workflow_dispatch` still publish;
        #       neither is something a mirror performs.
        #
        #       COST: a recipe commit no longer produces a release. The build
        #       still runs on push, which is the whole value of push CI here.
        #
        #   authority == 'github'
        #       So that with the same workflow present on both forges, only one
        #       of them publishes. SKIPS rather than fails when the switch names
        #       Forgejo: a deliberate handover must not look like a broken
        #       pipeline.
        if: >-
            github.event_name != 'push' &&
            needs.gate.outputs.authority == 'github'
        runs-on: 'ubuntu-latest'
        needs: 
        - build-linux-x86_64
        - gate
        # - build-linux-arm64
        # - build-macos-arm64
        - version-check
        permissions:
            contents: write
        steps:
        - name: Create Release
          id: create_release
          uses: actions/create-release@v1
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
            tag_name: "v${{ needs.version-check.outputs.rls_version }}"
            release_name: "Release v${{ needs.version-check.outputs.rls_version }}"
            body: |
              Build of QEMU RISC-V ${{ needs.version-check.outputs.qemu_tag }}
              Version: ${{ needs.version-check.outputs.rls_version }}
            draft: false
            prerelease: false
        - name: Download build artifacts
          uses: actions/download-artifact@v4
          with:
            pattern: "qemu-riscv-*"
            path: release
            merge-multiple: true

        - name: Upload assets to release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: "v${{ needs.version-check.outputs.rls_version }}"
            files: |
              release/**/*.tar.gz
            fail_on_unmatched_files: true
